[build-system]
requires=[
	"setuptools>=77.0.0",
	"versioningit",
]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/ale94mleon/Meeko"
Issues = "https://github.com/ale94mleon/Meeko/issues"
"Original project" = "https://github.com/forlilab/Meeko"
"Original documentation" = "https://meeko.readthedocs.io"

[project]
name = "meeko4moldrug"
dynamic = ["version"]
description = "A trimmed-down Meeko for moldrug: fork of Meeko 0.6.1 without the Python <3.12 cap and the heavier dependencies"
readme = "README.md"
license-files = ["LICENSE"]

authors=[
    {name="Forli Lab", email="forli@scripps.edu"},
    {name="Alejandro Martínez León", email="ale94mleon@gmail.com"},
]

classifiers = [
        'Environment :: Console',
        'Environment :: Other Environment',
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'Natural Language :: English',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: OS Independent',
        'Operating System :: POSIX :: Linux',
        'Programming Language :: C++',
        'Programming Language :: Python',
        'Topic :: Scientific/Engineering :: Bio-Informatics',
        'Topic :: Scientific/Engineering :: Chemistry',
        'Topic :: Software Development :: Libraries'
]
keywords = [
    "molecular",
    "modeling",
    "drug design",
    "docking",
    "autodock",
]

requires-python = ">= 3.8"
dependencies = [
    'numpy>=1.18',
    "rdkit",
    "scipy",
]


[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}.post{distance}"
dirty = "{base_version}.post{distance}.dev0"
distance-dirty = "{base_version}.post{distance}.dev0"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.write]
file = "src/meeko4moldrug/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeko4moldrug = [
    "data/params/*",
]
